<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="dark-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181e29" />
      <stop offset="100%" stop-color="#0e121a" />
    </linearGradient>
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="accent-bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>
  </defs>

  <!-- Base Grid Dashboard Card -->
  <rect width="512" height="512" rx="128" fill="url(#dark-base)" stroke="#232d3f" stroke-width="4" />

  <!-- The Watcher Dial (Telemetry Gauge Ring) -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#232d3f" stroke-width="12" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#neon-glow)" stroke-width="12" stroke-dasharray="660" stroke-dashoffset="180" stroke-linecap="round" />
  
  <!-- Outer Technical Tick Marks -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#4facfe" stroke-width="6" stroke-dasharray="4 28" opacity="0.4" />

  <!-- High-Precision Energy Bolt -->
  <path d="M276 96 L176 256 L246 256 L236 416 L336 256 L266 256 Z" fill="url(#accent-bolt)" filter="drop-shadow(0px 0px 20px rgba(56,239,125,0.4))" />
</svg>
