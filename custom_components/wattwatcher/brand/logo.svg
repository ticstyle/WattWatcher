      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="accent-bolt-logo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>
  </defs>

  <!-- Background -->
